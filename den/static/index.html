<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentWaiter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 8a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8z' fill='%231b1f24'/%3E%3Cpath d='M2.5 19h19M12 8V5.5M10 5.5h4' fill='none' stroke='%231b1f24' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Shown only when /api/config reports runtime "local" (see app.js boot()). -->
  <div id="dev-banner" class="dev-banner" hidden>
    Development mode: agents run directly on this machine without containers. Do not expose this server to other people.
  </div>

  <header class="topbar">
    <a class="brand" href="#/agents" aria-label="AgentWaiter home">
      <!-- Service bell: the bell you ring to call a waiter. One flat colour. -->
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8z" fill="currentColor"/>
        <path d="M2.5 19h19M12 8V5.5M10 5.5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">AgentWaiter</span>
    </a>
    <div id="user-box" class="user-box" hidden>
      <span id="user-email" class="user-email"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Log out</button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- Transient error and success messages; filled by toast() in app.js. -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- Plain script on purpose: no modules, no CDN, no build step. -->
  <script src="/static/app.js"></script>
</body>
</html>
