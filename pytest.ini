[pytest]
# Async tests (the scheduler tests) run without per-test decorators.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Lets test modules `from tests.conftest import ...` from the repo root.
pythonpath = .
# The Docker end-to-end test needs a daemon; run it with `pytest -m docker`.
addopts = -m "not docker"
markers =
    docker: needs a working Docker daemon (run with: pytest -m docker)
